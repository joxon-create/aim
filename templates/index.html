<!DOCTYPE html>
<html>
<head>
    <title>AimDrop - Professional</title>
    <style>
        body { background: #0f1923; color: white; font-family: sans-serif; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
        .case { background: #1a2d3d; padding: 20px; border: 2px solid #3d5a73; border-radius: 10px; cursor: pointer; }
        .case:hover { border-color: gold; }
    </style>
</head>
<body>
    <h1>AIMDROP PRO</h1>
    <div class="grid">
        {% for id, data in cases.items() %}
        <div class="case" onclick="openCase('{{id}}')">
            <h3>{{id}}</h3>
            <p>Narxi: {{data.price}} UC</p>
        </div>
        {% endfor %}
    </div>
    <h2 id="res"></h2>
    <script>
        async function openCase(id) {
            const res = await fetch(`/open/${id}`, {method: 'POST'});
            const data = await res.json();
            document.getElementById('res').innerText = "Yutdingiz: " + data.item;
        }
    </script>
</body>
</html>
