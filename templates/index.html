<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>PUBG Case & Ecosystem</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; }
        .card { background-color: #1e1e1e; border: none; }
        .crash-screen { font-size: 48px; font-weight: bold; color: #00ffcc; text-align: center; padding: 40px; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">PUBG CASE & ECOSYSTEM</h1>
        <hr>
        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card p-4 text-center">
                    <h3>Global Crash O'yini</h3>
                    <div class="crash-screen" id="multiplier">1.00x</div>
                    <p id="status-text" class="text-warning">Kutilmoqda...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateCrash() {
            fetch('/api/crash_status')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('multiplier').innerText = data.multiplier + 'x';
                    document.getElementById('status-text').innerText = data.status.toUpperCase();
                });
        }
        setInterval(updateCrash, 200);
    </script>
</body>
</html>
