<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f1923; color: white; font-family: 'Arial', sans-serif; }
        .sidebar { width: 200px; height: 100vh; background: #1a2d3d; position: fixed; }
        .game-btn { display: block; padding: 15px; cursor: pointer; color: white; text-decoration: none; }
        .game-btn:hover { background: #3d5a73; }
        .main-content { margin-left: 220px; padding: 20px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>AIMDROP</h2>
        <a class="game-btn" onclick="loadGame('mines')"><i class="fas fa-bomb"></i> Mines</a>
        <a class="game-btn" onclick="loadGame('tower')"><i class="fas fa-chart-line"></i> Tower</a>
        <a class="game-btn" onclick="loadGame('crush')"><i class="fas fa-rocket"></i> Crush</a>
    </div>
    <div class="main-content">
        <div id="game-area">
            <h1>O'yinni tanlang</h1>
        </div>
    </div>

    <script>
        async function loadGame(game) {
            document.getElementById('game-area').innerHTML = `<h2>${game.toUpperCase()} o'yini yuklanmoqda...</h2>`;
            // Bu yerda o'yin interfeysini yaratamiz
        }
    </script>
</body>
</html>
