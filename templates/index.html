<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>AimDrop Pro - Case Opener</title>
    <style>
        body { background: #0f1923; color: white; font-family: sans-serif; text-align: center; }
        .case-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 50px; }
        .case-card { background: #1a2d3d; padding: 20px; border-radius: 10px; cursor: pointer; border: 2px solid #3d5a73; }
        .case-card:hover { border-color: gold; }
        #win-msg { color: gold; font-size: 24px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>AIMDROP PRO</h1>
    <div class="case-grid">
        {% for id, data in cases.items() %}
        <div class="case-card" onclick="openCase('{{id}}')">
            <h3>{{data.name}}</h3>
            <p>{{data.price}} UC</p>
        </div>
        {% endfor %}
    </div>
    <div id="win-msg"></div>

    <script>
        async function openCase(id) {
            const res = await fetch(`/open/${id}`, {method: 'POST'});
            const data = await res.json();
            document.getElementById('win-msg').innerText = "Siz yutdingiz: " + data.item;
        }
    </script>
</body>
</html>
